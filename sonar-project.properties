sonar.projectKey=lucassilva-dev_LeagueOfBronze
sonar.projectName=SiteCampeonato
sonar.projectVersion=1.0.0
sonar.organization=lucassilva-dev

sonar.sourceEncoding=UTF-8
sonar.sources=app,components,lib,types
sonar.tests=tests
sonar.test.inclusions=tests/**/*.test.ts

sonar.exclusions=.next/**,node_modules/**,coverage/**,public/**,supabase/**,.tmp_ssh/**,next-env.d.ts,leagueofbronze.json
# lib/admin-auth.ts, lib/data-store.ts e lib/schema.ts saíram desta lista: são o
# código de autenticação, de acesso ao banco e de validação de entrada. Esconder a
# cobertura deles era esconder exatamente a parte que precisa de teste.
sonar.coverage.exclusions=tests/**,**/*.test.ts,app/**,components/**,types/**,lib/server-data.ts,lib/utils.ts,eslint.config.mjs,next.config.ts,postcss.config.js,tailwind.config.ts,vitest.config.ts
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.tsconfigPath=tsconfig.json
